<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>SimulQuery</title>
    </h:head>
    <h:body style="background-color: #2d354b">
        <h:form id="f1">
            <br /><br /><br /><br /><br /><br />
            <div style="text-align: center">
                <h1 style="color:antiquewhite">SimulQUERY</h1>
                <p:selectOneMenu value="#{bd.obj.tipoBD}">
                    <f:selectItem itemLabel="Selecciona tu gestor" itemValue="" noSelectionOption="true" />
                    <f:selectItem itemLabel="MySQL" itemValue="a" />
                    <f:selectItem itemLabel="Postgres-XL" itemValue="b" />
                    <f:selectItem itemLabel="PostgreSQL" itemValue="c" />
                    <f:selectItem itemLabel="MongoDB" itemValue="d" />
                </p:selectOneMenu><br/>
                <br />
                <p:commandButton ajax="false" value="Conexión" action="#{bd.configuracion()}" update="f2:d1" />
            </div>
        </h:form>
            <h:form id="f2">
                <p:growl id="mensajes"  showDetail="true" />
                <h:inputHidden value="#{bd.obj.tipoBD}" />
                <p:dialog header="Configurar conexión" id="d1" visible="#{bd.bconfig}"  closable="false" >
                    <p:panelGrid columns="2"> 

                        <p:outputLabel value="Dirección de la base de datos" />
                        <p:inputText value="#{bd.obj.dirbd}" placeholder="#.#.#.#:#" required="true">
                            <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                        </p:inputText>
                        <p:outputLabel value="Nombre de la base de datos" />
                        <p:inputText value="#{bd.obj.nombd}" required="true">
                            <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                        </p:inputText>
                        <p:outputLabel value="Usuario administrador de la base de datos" />
                        <p:inputText value="#{bd.obj.usubd}" title="Para MongoDB, si la autenticación esta deshabilitada, este campo y el siguiente no son obligatorios">
                            <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                        </p:inputText>
                        <p:outputLabel value="Contraseña"/>
                        <p:password value="#{bd.obj.passbd}" title="Si la base de datos no tiene contraseña, este campo no es obligatorio" >
                            <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                        </p:password>
                        <p:outputLabel value="Nombre de la tabla" />
                        <p:selectOneMenu id="tb" value="#{bd.obj.tabla.nombre}" rendered="true">
                            <f:selectItems value="#{bd.obj.tablas}"/>
                        </p:selectOneMenu>
                        <h:outputText value="Número de consultas por sitio" />
                        <p:inputNumber decimalPlaces="0" value="#{bd.obj.NConsultas}" />
                        <h:outputText value="Número de sitios" />
                        <p:inputNumber decimalPlaces="0" value="#{bd.obj.NSitios}" />
                        <h:outputText value="Tipo de consultas" />
                        <p:selectManyCheckbox value="#{bd.arrOPERACIONES}">
                            <f:selectItem itemLabel="Selección" itemValue="a" />
                            <f:selectItem itemLabel="Actualización" itemValue="b" />
                            <f:selectItem itemLabel="Eliminación" itemValue="c" />
                            <f:selectItem itemLabel="Inserción" itemValue="d" />
                        </p:selectManyCheckbox>
                    </p:panelGrid>               
                    <p:commandButton value="Probar conexión" action="#{bd.probarConexion()}" update="f2:g f2:dl3 f2:mensajes"/>
                    <p:commandButton value="Cancelar"  action="#{bd.cancelarConf()}" update="f2:d1"/>
                    <p:commandButton id="g" disabled="#{!bd.bbotonfragmentar}" value="Generar log" action="#{bd.sig2()}" update="mensajes b"  />
                    <p:commandButton ajax="false" value="Descargar log" disabled="#{bd.listo}" id="b">
                        <p:fileDownload value="#{arch.file}" />
                    </p:commandButton>
                </p:dialog>
                <p:dialog id="dl3" header="Información" visible="#{bd.bdatosincorrectos}" modal="true">
                    <h:outputText value="La conexión no fue exitosa. Revise sus datos."/><br /><br />
                    <p:commandButton value="Revisar" action="#{bd.revisarDatos()}" update="f2:dl3" />
                </p:dialog>
                <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()"/>

                <p:dialog width="20%" widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                    <h:graphicImage style="margin-left: 40%" name="images/load.gif" width="20%"/>
                </p:dialog>
            </h:form>
        
    </h:body>
</html>
